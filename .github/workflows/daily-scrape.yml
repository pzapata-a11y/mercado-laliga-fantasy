name: Scrape mercado LaLiga Fantasy

on:
  schedule:
    # 06:00 UTC ≈ 08:00 hora española en verano / 07:00 en invierno.
    # El mercado se actualiza a las 00:17h española, así que hay margen de sobra.
    - cron: '0 6 * * *'
  workflow_dispatch: {}   # permite lanzarlo manualmente para probar

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - run: node scrape.mjs

      - name: Commit y push de los datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Datos de mercado $(date +'%Y-%m-%d')"
          git push
